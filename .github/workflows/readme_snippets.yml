name: readme

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 13 * * 4'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: mpi4py/setup-mpi@v1
      - run: pip install -e .
      - run: pip install pytest-codeblocks pytest matplotlib
      - run: sudo apt-get install librsvg2-bin
      - run: python scripts/extract_readme_code.py readme.py
      - run: cat -n readme.py
      - run: mpiexec -n 4 python -We readme.py
      - run: rsvg-convert readme_plot.svg > readme_plot.png
      - uses: actions/upload-artifact@v7
        with:
          path: readme_plot.*
          name: readme_plot
      - if: github.ref == 'refs/heads/main'
        uses: eine/tip@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            readme_plot.png
